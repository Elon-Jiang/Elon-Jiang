name: Update profile cards

on:
  schedule:
    # UTC 02:17 = 北京时间 10:17。GitHub 定时任务可能延迟。
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/generate_stats.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public contributions and generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/ data/ preview.html
          if git diff --cached --quiet; then
            echo 'Profile is already current.'
            exit 0
          fi
          git commit -m 'chore: refresh public contribution cards'
          git push
